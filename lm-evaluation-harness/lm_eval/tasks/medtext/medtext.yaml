task: medtext
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    # This must point to the JSON file you generated that contains only the medtext target data.
    train: lm_eval/tasks/medtext/medtext.jsonl
description: >
  Instructions: The following text is from a collection of medical records. What follows is the patients record. Answer how a doctor would, what is the likely diagnosis, and what is the treatment?. Answer how a doctor would, what is the likely diagnosis, and what is the treatment?

output_type: generate_until
training_split: train
validation_split: train
test_split: train
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results
generation_kwargs:
  until:
    - "\n\n"
metric_list:
  # - metric: bleu
  #   aggregation: nanmean
  #   higher_is_better: true
  - metric: rouge1
    aggregation: nanmean
    higher_is_better: true
  - metric: rouge2
    aggregation: nanmean
    higher_is_better: true
  - metric: rougeL
    aggregation: nanmean
    higher_is_better: true
  # - metric: bleurt
  #   aggregation: nanmean
  #   higher_is_better: true
  # - metric: bert_score
  #   aggregation: nanmean
  #   higher_is_better: true
metadata:
  version: 1.0
